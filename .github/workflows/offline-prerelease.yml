name: Package offline Wiki prerelease
on:
  push:
    branches: [dot/dev-agi-society-cn-20261019]
    paths: [release/offline-preview.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-prerelease-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/dot/dev-agi-society-cn-20261019'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build root-path preview, not production
        run: npm run build
        env:
          VITEPRESS_PREVIEW: 'true'
          VITEPRESS_BASE: /
      - name: Check content and core local discussion behavior
        run: |
          npm run check:content-links
          node --test tests/community-drafts.test.mjs tests/wiki-relations.test.mjs
      - name: Build offline HTML and reviewed release boundary
        run: |
          node scripts/offline/build.mjs
          python3 tests/offline-release.test.py
          python3 scripts/offline/release.py
      - name: Publish unique prerelease (never Latest, never overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="wiki-preview-${GITHUB_SHA}"
          existing_tags=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq 'length')
          if [ "$existing_tags" != "0" ]; then
            echo "Preview tag already exists; refusing to reuse a potentially conflicting tag."
            exit 1
          fi
          if gh release view "$tag" --json url; then
            echo "Same-commit release already exists; refusing to overwrite or duplicate."
            exit 1
          fi
          gh release create "$tag" delivery/release/*.zip delivery/release/*.html delivery/release/SHA256SUMS.txt delivery/release/release-manifest.json \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "AGI Wiki 离线预览 ${GITHUB_SHA:0:12}" --notes-file delivery/release/release-notes.md
          gh release view "$tag" --json url,targetCommitish,isPrerelease,assets
