name: Deploy VitePress to GitHub Pages and Tencent Cloud mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build project-path site for GitHub Pages
        run: npx vitepress build
        env:
          VITEPRESS_BASE: /agi-society-cn/

      - name: Preserve GitHub Pages artifact
        run: mv dist dist-pages

      - name: Build root-path site for Tencent Cloud mirror
        run: npx vitepress build
        env:
          VITEPRESS_BASE: /

      - name: Preserve Tencent Cloud artifact
        run: mv dist dist-mirror

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - name: Upload Tencent Cloud mirror artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiki-mirror-dist
          path: dist-mirror
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-mirror:
    needs: build
    if: ${{ vars.WIKI_MIRROR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      WIKI_DEPLOY_HOST: ${{ vars.WIKI_DEPLOY_HOST || '120.53.232.88' }}
      WIKI_DEPLOY_USER: ${{ vars.WIKI_DEPLOY_USER || 'wiki-deploy' }}
      WIKI_DEPLOY_ROOT: /var/www/agi-wiki
    steps:
      - name: Download Tencent Cloud mirror artifact
        uses: actions/download-artifact@v4
        with:
          name: wiki-mirror-dist
          path: dist-mirror

      - name: Prepare SSH client
        env:
          WIKI_DEPLOY_SSH_KEY: ${{ secrets.WIKI_DEPLOY_SSH_KEY }}
          WIKI_DEPLOY_KNOWN_HOSTS: ${{ secrets.WIKI_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$WIKI_DEPLOY_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$WIKI_DEPLOY_SSH_KEY" > "$HOME/.ssh/agi-wiki-deploy"
          chmod 600 "$HOME/.ssh/agi-wiki-deploy"
          if [ -n "$WIKI_DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$WIKI_DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -H "$WIKI_DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          fi

      - name: Pack mirror artifact
        run: tar -czf wiki-mirror.tar.gz -C dist-mirror .

      - name: Upload mirror release
        run: |
          scp -i "$HOME/.ssh/agi-wiki-deploy" \
            wiki-mirror.tar.gz \
            "$WIKI_DEPLOY_USER@$WIKI_DEPLOY_HOST:/home/$WIKI_DEPLOY_USER/wiki-mirror-${GITHUB_SHA}.tar.gz"

      - name: Activate mirror release atomically
        run: |
          ssh -i "$HOME/.ssh/agi-wiki-deploy" "$WIKI_DEPLOY_USER@$WIKI_DEPLOY_HOST" \
            "/usr/local/sbin/agi-wiki-deploy activate $GITHUB_SHA"
