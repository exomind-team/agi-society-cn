name: Deploy VitePress to GitHub Pages and Tencent Cloud mirror

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build project-path site for GitHub Pages
        run: npx vitepress build
        env:
          VITEPRESS_BASE: /agi-society-cn/

      - name: Preserve GitHub Pages artifact
        run: mv dist dist-pages

      - name: Check GitHub Pages content links and assets
        run: node scripts/check-content-links.mjs --dist=dist-pages --base=/agi-society-cn/

      - name: Build root-path site for Tencent Cloud mirror
        run: npx vitepress build
        env:
          VITEPRESS_BASE: /

      - name: Preserve Tencent Cloud artifact
        run: mv dist dist-mirror

      - name: Check Tencent Cloud mirror content links and assets
        run: node scripts/check-content-links.mjs --dist=dist-mirror --base=/

      - name: Build WordPress subpath site for Tencent Cloud
        run: npx vitepress build
        env:
          VITEPRESS_BASE: /wiki/

      - name: Preserve WordPress subpath artifact
        run: mv dist dist-wordpress-wiki

      - name: Check WordPress subpath content links and assets
        run: node scripts/check-content-links.mjs --dist=dist-wordpress-wiki --base=/wiki/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - name: Upload Tencent Cloud mirror artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiki-mirror-dist
          path: dist-mirror
          retention-days: 7

      - name: Upload WordPress subpath artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiki-wordpress-wiki-dist
          path: dist-wordpress-wiki
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  sync-gitea-source:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      GITEA_API_BASE: https://gitea.hailay.site/api/v1
      GITEA_REPOSITORY: agiteam/agi-society-cn
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trigger and verify Gitea mirror sync for main and dev
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_CI_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GITEA_TOKEN"
          git fetch --no-tags origin main dev
          github_main=$(git rev-parse refs/remotes/origin/main)
          github_dev=$(git rev-parse refs/remotes/origin/dev)
          mirror_sync_url="$GITEA_API_BASE/repos/$GITEA_REPOSITORY/mirror-sync"

          curl -4 -fsS --retry 2 --connect-timeout 20 --max-time 30 \
            -X POST \
            -H 'Accept: application/json' \
            -H "Authorization: token $GITEA_TOKEN" \
            "$mirror_sync_url" > /dev/null

          for attempt in $(seq 1 20); do
            gitea_main=$(curl -4 -fsS --retry 2 --connect-timeout 20 --max-time 30 \
              -H 'Accept: application/json' \
              -H "Authorization: token $GITEA_TOKEN" \
              "$GITEA_API_BASE/repos/$GITEA_REPOSITORY/branches/main" | jq -r '.commit.id')
            gitea_dev=$(curl -4 -fsS --retry 2 --connect-timeout 20 --max-time 30 \
              -H 'Accept: application/json' \
              -H "Authorization: token $GITEA_TOKEN" \
              "$GITEA_API_BASE/repos/$GITEA_REPOSITORY/branches/dev" | jq -r '.commit.id')
            if [[ "$gitea_main" == "$github_main" && "$gitea_dev" == "$github_dev" ]]; then
              printf 'gitea_source_synced main=%s dev=%s attempts=%s\n' \
                "$gitea_main" "$gitea_dev" "$attempt"
              exit 0
            fi
            sleep 3
          done

          printf 'gitea_source_mismatch github_main=%s gitea_main=%s github_dev=%s gitea_dev=%s\n' \
            "$github_main" "$gitea_main" "$github_dev" "$gitea_dev"
          exit 1

  publish-gitea-mirror:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && vars.GITEA_MIRROR_ENABLED == 'true' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      GITEA_API_BASE: https://gitea.hailay.site/api/v1
      GITEA_REPOSITORY: agiteam/agi-society-cn
      GITEA_RELEASE_RETENTION: '16'
    steps:
      - uses: actions/checkout@v4

      - name: Download Tencent Cloud mirror artifact
        uses: actions/download-artifact@v4
        with:
          name: wiki-mirror-dist
          path: dist-mirror

      - name: Download WordPress subpath artifact
        uses: actions/download-artifact@v4
        with:
          name: wiki-wordpress-wiki-dist
          path: dist-wordpress-wiki

      - name: Pack and checksum mirror artifact
        run: |
          tar -czf "wiki-mirror-${GITHUB_SHA}.tar.gz" -C dist-mirror .
          sha256sum "wiki-mirror-${GITHUB_SHA}.tar.gz" > "wiki-mirror-${GITHUB_SHA}.tar.gz.sha256"
          tar -czf "wiki-wordpress-wiki-${GITHUB_SHA}.tar.gz" -C dist-wordpress-wiki .
          sha256sum "wiki-wordpress-wiki-${GITHUB_SHA}.tar.gz" > "wiki-wordpress-wiki-${GITHUB_SHA}.tar.gz.sha256"

      - name: Publish Gitea Release artifact and retain latest 16
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_CI_PUBLISH_TOKEN }}
          GITEA_ARCHIVE_PATH: wiki-mirror-${{ github.sha }}.tar.gz
          GITEA_CHECKSUM_PATH: wiki-mirror-${{ github.sha }}.tar.gz.sha256
        run: |
          node scripts/publish-gitea-release.mjs
          GITEA_ARCHIVE_PATH="wiki-wordpress-wiki-${GITHUB_SHA}.tar.gz" \
            GITEA_CHECKSUM_PATH="wiki-wordpress-wiki-${GITHUB_SHA}.tar.gz.sha256" \
            node scripts/publish-gitea-release.mjs

  deploy-mirror:
    needs: [build, publish-gitea-mirror]
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.build.result == 'success' && vars.WIKI_MIRROR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      WIKI_DEPLOY_HOST: ${{ vars.WIKI_DEPLOY_HOST || '120.53.232.88' }}
      WIKI_DEPLOY_USER: ${{ vars.WIKI_DEPLOY_USER || 'wiki-deploy-20260918-5f921eef' }}
      WIKI_DEPLOY_ROOT: /var/www/agi-wiki
    steps:
      - name: Download Tencent Cloud mirror artifact
        uses: actions/download-artifact@v4
        with:
          name: wiki-mirror-dist
          path: dist-mirror

      - name: Download WordPress subpath artifact
        uses: actions/download-artifact@v4
        with:
          name: wiki-wordpress-wiki-dist
          path: dist-wordpress-wiki

      - name: Prepare SSH client
        env:
          WIKI_DEPLOY_SSH_KEY: ${{ secrets.WIKI_DEPLOY_SSH_KEY }}
          WIKI_DEPLOY_KNOWN_HOSTS: ${{ secrets.WIKI_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$WIKI_DEPLOY_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$WIKI_DEPLOY_SSH_KEY" > "$HOME/.ssh/agi-wiki-deploy"
          chmod 600 "$HOME/.ssh/agi-wiki-deploy"
          if [ -n "$WIKI_DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$WIKI_DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -H "$WIKI_DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          fi

      - name: Try Tencent Cloud pull from Gitea
        id: gitea_sync
        if: ${{ vars.GITEA_MIRROR_ENABLED == 'true' && needs.publish-gitea-mirror.result == 'success' }}
        continue-on-error: true
        run: |
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -i "$HOME/.ssh/agi-wiki-deploy" "$WIKI_DEPLOY_USER@$WIKI_DEPLOY_HOST" \
            "/usr/local/sbin/agi-wiki-deploy sync-gitea $GITHUB_SHA"

      - name: Pack mirror artifact
        if: ${{ steps.gitea_sync.outcome != 'success' }}
        run: |
          tar -czf wiki-mirror.tar.gz -C dist-mirror .
          tar -czf wiki-wp-mirror.tar.gz -C dist-wordpress-wiki .

      - name: Upload mirror release
        if: ${{ steps.gitea_sync.outcome != 'success' }}
        run: |
          curl -4 -sS -o /dev/null --max-time 20 \
            -w 'github_runner_to_tencent_http status=%{http_code} connect=%{time_connect}s total=%{time_total}s\n' \
            "http://$WIKI_DEPLOY_HOST/"
          upload_start_ns=$(date +%s%N)
          upload_start=$(date -u +%FT%TZ)
          scp -O -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -i "$HOME/.ssh/agi-wiki-deploy" \
            wiki-mirror.tar.gz \
            "$WIKI_DEPLOY_USER@$WIKI_DEPLOY_HOST:/home/$WIKI_DEPLOY_USER/wiki-mirror-${GITHUB_SHA}.tar.gz"
          scp -O -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -i "$HOME/.ssh/agi-wiki-deploy" \
            wiki-wp-mirror.tar.gz \
            "$WIKI_DEPLOY_USER@$WIKI_DEPLOY_HOST:/home/$WIKI_DEPLOY_USER/wiki-wp-mirror-${GITHUB_SHA}.tar.gz"
          upload_end_ns=$(date +%s%N)
          upload_end=$(date -u +%FT%TZ)
          upload_bytes=$(stat -c '%s' wiki-mirror.tar.gz)
          upload_seconds=$(awk "BEGIN { print ($upload_end_ns - $upload_start_ns) / 1000000000 }")
          upload_rate=$(awk "BEGIN { print $upload_bytes / $upload_seconds }")
          printf 'github_runner_to_tencent_scp start=%s end=%s bytes=%s seconds=%s bytes_per_second=%s\n' \
            "$upload_start" "$upload_end" "$upload_bytes" "$upload_seconds" "$upload_rate"

      - name: Activate mirror release atomically
        if: ${{ steps.gitea_sync.outcome != 'success' }}
        run: |
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -i "$HOME/.ssh/agi-wiki-deploy" "$WIKI_DEPLOY_USER@$WIKI_DEPLOY_HOST" \
            "/usr/local/sbin/agi-wiki-deploy activate $GITHUB_SHA"
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -i "$HOME/.ssh/agi-wiki-deploy" "$WIKI_DEPLOY_USER@$WIKI_DEPLOY_HOST" \
            "/usr/local/sbin/agi-wiki-deploy activate-wp $GITHUB_SHA"
